<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --paper: #EEF0EA;
    --paper-line: #C9CEC2;
    --ink: #1E2A38;
    --graphite: #5B6259;
    --stamp: #B03A2E;
    --brass: #8A6A3B;
    --card: #F6F7F2;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 40px,
      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }

  /* ---------- App chrome ---------- */

  .topbar{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--ink);
    color: var(--paper);
    padding: 12px 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .topbar .title{
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
  }

  .topbar .actions{ display: flex; gap: 10px; align-items: center; }

  .btn{
    border: 1px solid var(--paper);
    background: transparent;
    color: var(--paper);
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .btn:hover{ background: var(--paper); color: var(--ink); }

  .btn-stamp{
    border-color: var(--stamp);
    background: var(--stamp);
    color: #fff;
  }
  .btn-stamp:hover{ background: #8f2f24; border-color: #8f2f24; color: #fff; }

  .autosave-note{ opacity: 0.7; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 24px 120px;
  }

  fieldset{
    border: 1.5px solid var(--ink);
    background: var(--card);
    padding: 20px 22px 22px;
    margin: 0 0 32px;
  }

  legend{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stamp);
    padding: 0 6px;
  }

  label.field{
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--graphite);
    margin: 14px 0 5px;
  }
  label.field:first-child{ margin-top: 0; }

  input[type=text], input[type=date], textarea, select{
    width: 100%;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 8px 10px;
  }

  textarea{ resize: vertical; }

  .row{ display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div{ flex: 1; min-width: 160px; }

  .dropzone{
    border: 1.5px dashed var(--paper-line);
    background: #fff;
    padding: 18px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--graphite);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .dropzone.drag{ border-color: var(--stamp); color: var(--stamp); }
  .dropzone img.preview{
    display: block;
    max-width: 100%;
    max-height: 220px;
    margin: 0 auto 10px;
    border: 1px solid var(--paper-line);
    object-fit: contain;
  }

  /* ---------- Block list ---------- */

  #blockList{ display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px; }

  .block-card{
    border: 1.5px solid var(--ink);
    background: var(--card);
  }

  .block-card .card-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--ink);
    color: var(--paper);
    padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .card-head .ctrls{ display: flex; gap: 6px; }
  .card-head button{
    background: transparent;
    border: 1px solid var(--paper);
    color: var(--paper);
    font-size: 11px;
    padding: 2px 7px;
    line-height: 1.4;
  }
  .card-head button:hover{ background: var(--paper); color: var(--ink); }
  .card-head button.danger:hover{ background: var(--stamp); border-color: var(--stamp); color: #fff; }

  .card-body{ padding: 18px 20px; }

  .add-toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    border: 1.5px dashed var(--paper-line);
    padding: 18px;
    margin-bottom: 60px;
  }

  .add-toolbar button{
    border: 1px solid var(--ink);
    background: var(--card);
    color: var(--ink);
    padding: 9px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .add-toolbar button:hover{ background: var(--ink); color: var(--paper); }

  .hint{
    font-size: 11.5px;
    color: var(--graphite);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px;
  }

  /* range sliders */
  input[type=range]{ width: 100%; accent-color: var(--stamp); }
  .range-readout{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--graphite);
  }

  /* checkbox row */
  .check-row{ display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }

  /* ---------- Preview typography (mirrors post-template.html) ---------- */
  .preview{
    background: #fff;
    border: 1px dashed var(--paper-line);
    padding: 16px;
    margin-top: 14px;
  }
  .preview h2{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:22px; margin:0; }
  .preview h3{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:16px; margin:0; }
  .preview p{ margin:0; line-height:1.7; }
  .preview figcaption{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--graphite); padding-top:6px; }
  .preview pre{ background:var(--ink); color:#E8EAE3; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.6; padding:16px; margin:0; border-radius:8px; overflow:auto; }

  canvas.model-canvas{
    width: 100%;
    display: block;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    touch-action: none;
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="title">Post Builder</span>
  <div class="actions">
    <span class="autosave-note" id="autosaveNote">draft autosaved</span>
    <button class="btn" id="clearDraftBtn">Clear draft</button>
    <button class="btn btn-stamp" id="exportBtn">Export HTML ↓</button>
  </div>
</div>

<div class="wrap">

  <fieldset>
    <legend>Post metadata</legend>

    <div class="row">
      <div>
        <label class="field">Category / eyebrow</label>
        <input type="text" id="metaCategory" placeholder="e.g. Aerospace">
      </div>
      <div>
        <label class="field">Date</label>
        <input type="date" id="metaDate">
      </div>
    </div>

    <label class="field">Title</label>
    <input type="text" id="metaTitle" placeholder="Post title">

    <label class="field">Dek (one-line summary)</label>
    <textarea id="metaDek" rows="2" placeholder="One or two sentences that frame the post"></textarea>

    <div class="row">
      <div>
        <label class="field">Tags (comma separated)</label>
        <input type="text" id="metaTags" placeholder="Aerospace, Powertrain, VTOL">
      </div>
      <div>
        <label class="field">Read time</label>
        <input type="text" id="metaReadTime" placeholder="~9 min">
      </div>
    </div>

    <label class="field">Hero image</label>
    <div class="dropzone" id="heroDrop" tabindex="0">Drag &amp; drop an image, or click to choose one</div>
    <input type="file" id="heroFile" accept="image/*" hidden>
    <label class="field">Hero image description (alt text)</label>
    <input type="text" id="heroAlt" placeholder="Describe the hero image">
  </fieldset>

  <div id="blockList"></div>

  <div class="add-toolbar">
    <button data-add="heading">+ Heading</button>
    <button data-add="text">+ Text block</button>
    <button data-add="image">+ Image</button>
    <button data-add="code">+ Code block</button>
    <button data-add="model">+ 3D model</button>
  </div>

</div>

<script type="module">
import { initModelViewer, buildViewerScriptTag } from './model-viewer.mjs';

/* =========================================================
   State
   ========================================================= */

let blockCounter = 0;
const fileStore = new Map(); // blockId -> { hero?: File, image?: File, models?: File[] }

const blockList = document.getElementById('blockList');

/* =========================================================
   Draft autosave (text fields only — files must be re-dropped
   after a reload, noted in the UI)
   ========================================================= */

const DRAFT_KEY = 'postBuilderDraft';

function collectTextDraft(){
  const meta = {
    category: val('metaCategory'), date: val('metaDate'), title: val('metaTitle'),
    dek: val('metaDek'), tags: val('metaTags'), readTime: val('metaReadTime'),
    heroAlt: val('heroAlt')
  };
  const blocks = [...blockList.children].map(card => {
    const type = card.dataset.type;
    const base = { type };
    if(type === 'heading'){
      base.level = card.querySelector('.f-level').value;
      base.align = card.querySelector('.f-align').value;
      base.text = card.querySelector('.f-text').innerHTML;
    } else if(type === 'text'){
      base.font = card.querySelector('.f-font').value;
      base.size = card.querySelector('.f-size').value;
      base.align = card.querySelector('.f-align').value;
      base.html = card.querySelector('.f-html').innerHTML;
    } else if(type === 'image'){
      base.alt = card.querySelector('.f-alt').value;
      base.caption = card.querySelector('.f-caption').value;
      base.width = card.querySelector('.f-width').value;
      base.align = card.querySelector('.f-align').value;
    } else if(type === 'code'){
      base.lang = card.querySelector('.f-lang').value;
      base.code = card.querySelector('.f-code').value;
      base.height = card.querySelector('.f-height').value;
      base.description = card.querySelector('.f-desc').value;
    } else if(type === 'model'){
      base.caption = card.querySelector('.f-caption').value;
      base.wireframe = card.querySelector('.f-wireframe').checked;
    }
    return base;
  });
  return { meta, blocks };
}

function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify(collectTextDraft()));
    note('draft autosaved · ' + new Date().toLocaleTimeString());
  } catch(e){ note('autosave failed (storage full?)'); }
}

function note(msg){ document.getElementById('autosaveNote').textContent = msg; }

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 800);
}

document.getElementById('clearDraftBtn').addEventListener('click', () => {
  if(!confirm('Clear the autosaved draft? This does not affect an already-exported file.')) return;
  localStorage.removeItem(DRAFT_KEY);
  location.reload();
});

function val(id){ return document.getElementById(id).value; }

/* =========================================================
   Small helpers
   ========================================================= */

function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function escapeHtml(s){
  return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function nextId(prefix){ return prefix + '-' + (++blockCounter); }

/* =========================================================
   Block card chrome (shared header: move / delete)
   ========================================================= */

function cardShell(type, label){
  const card = document.createElement('div');
  card.className = 'block-card';
  card.dataset.type = type;
  card.id = nextId('block');

  const head = document.createElement('div');
  head.className = 'card-head';
  const title = document.createElement('span');
  title.textContent = label;
  const ctrls = document.createElement('div');
  ctrls.className = 'ctrls';

  const up = btn('↑', () => moveBlock(card, -1));
  const down = btn('↓', () => moveBlock(card, 1));
  const del = btn('✕ remove', () => { fileStore.delete(card.id); card.remove(); scheduleSave(); });
  del.classList.add('danger');

  ctrls.append(up, down, del);
  head.append(title, ctrls);

  const body = document.createElement('div');
  body.className = 'card-body';

  card.append(head, body);
  return { card, body };
}

function btn(txt, onClick){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = txt;
  b.addEventListener('click', onClick);
  return b;
}

function moveBlock(card, dir){
  const sibling = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if(!sibling) return;
  if(dir < 0) blockList.insertBefore(card, sibling);
  else blockList.insertBefore(sibling, card);
  scheduleSave();
}

function field(labelText, inputEl){
  const wrap = document.createElement('div');
  const lab = document.createElement('label');
  lab.className = 'field';
  lab.textContent = labelText;
  wrap.append(lab, inputEl);
  return wrap;
}

/* =========================================================
   Block: Heading
   ========================================================= */

function addHeadingBlock(){
  const { card, body } = cardShell('heading', 'Heading');

  const row = document.createElement('div');
  row.className = 'row';

  const level = document.createElement('select');
  level.className = 'f-level';
  ['h2','h3','h4'].forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l.toUpperCase(); level.appendChild(o); });

  const align = document.createElement('select');
  align.className = 'f-align';
  ['left','center'].forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; align.appendChild(o); });

  row.append(field('Level', level), field('Alignment', align));

  const toolbar = formatToolbar();

  const text = document.createElement('div');
  text.className = 'f-text';
  text.contentEditable = 'true';
  text.style.cssText = 'border:1px solid var(--paper-line);background:#fff;padding:10px 12px;font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;font-size:20px;min-height:40px;';
  text.dataset.placeholder = 'Heading text';
  text.textContent = '';

  body.append(row, toolbar, field('Text', text));
  [level, align].forEach(el => el.addEventListener('change', scheduleSave));
  text.addEventListener('input', scheduleSave);

  blockList.appendChild(card);
  scheduleSave();
}

function formatToolbar(){
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:6px;margin:10px 0 -4px;';
  const mk = (label, cmd) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'border:1px solid var(--ink);background:#fff;padding:4px 10px;font-size:12px;';
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => document.execCommand(cmd, false, null));
    return b;
  };
  bar.append(mk('B', 'bold'), mk('I', 'italic'), mk('Link', 'createLink'));
  bar.children[2].addEventListener('click', () => {
    const url = prompt('Link URL:');
    if(url) document.execCommand('createLink', false, url);
  });
  return bar;
}

/* =========================================================
   Block: Text
   ========================================================= */

function addTextBlock(){
  const { card, body } = cardShell('text', 'Text block');

  const row = document.createElement('div');
  row.className = 'row';

  const font = document.createElement('select');
  font.className = 'f-font';
  [['sans','IBM Plex Sans (body default)'],['serif','Source Serif 4'],['mono','IBM Plex Mono'],['display','Oswald']]
    .forEach(([v,l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; font.appendChild(o); });

  const size = document.createElement('input');
  size.type = 'range'; size.min = 14; size.max = 28; size.value = 16;
  size.className = 'f-size';
  const sizeOut = document.createElement('span');
  sizeOut.className = 'range-readout';
  sizeOut.textContent = '16px';
  size.addEventListener('input', () => { sizeOut.textContent = size.value + 'px'; applyTextStyle(); scheduleSave(); });

  const align = document.createElement('select');
  align.className = 'f-align';
  ['left','center','justify'].forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; align.appendChild(o); });

  const sizeWrap = document.createElement('div');
  sizeWrap.append(size, sizeOut);

  row.append(field('Font', font), field('Size', sizeWrap), field('Alignment', align));

  const toolbar = formatToolbar();

  const html = document.createElement('div');
  html.className = 'f-html';
  html.contentEditable = 'true';
  html.style.cssText = 'border:1px solid var(--paper-line);background:#fff;padding:10px 12px;min-height:90px;line-height:1.7;';

  function applyTextStyle(){
    const fam = { sans:"'IBM Plex Sans',sans-serif", serif:"'Source Serif 4',serif", mono:"'IBM Plex Mono',monospace", display:"'Oswald',sans-serif" }[font.value];
    html.style.fontFamily = fam;
    html.style.fontSize = size.value + 'px';
    html.style.textAlign = align.value;
  }
  font.addEventListener('change', () => { applyTextStyle(); scheduleSave(); });
  align.addEventListener('change', () => { applyTextStyle(); scheduleSave(); });
  html.addEventListener('input', scheduleSave);
  applyTextStyle();

  body.append(row, toolbar, field('Text', html));
  blockList.appendChild(card);
  scheduleSave();
}

/* =========================================================
   Block: Image
   ========================================================= */

function addImageBlock(){
  const { card, body } = cardShell('image', 'Image');

  const dz = document.createElement('div');
  dz.className = 'dropzone';
  dz.tabIndex = 0;
  dz.textContent = 'Drag & drop an image, or click to choose one';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.hidden = true;

  setupDropzone(dz, fileInput, async (file) => {
    const store = fileStore.get(card.id) || {};
    store.image = file;
    fileStore.set(card.id, store);
    const dataUrl = await fileToDataURL(file);
    dz.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'preview';
    img.src = dataUrl;
    dz.appendChild(img);
    const label = document.createElement('div');
    label.textContent = file.name + ' — drop a different file to replace';
    dz.appendChild(label);
    scheduleSave();
  });

  const alt = document.createElement('input');
  alt.type = 'text'; alt.className = 'f-alt'; alt.placeholder = 'Describe the image (alt text)';

  const caption = document.createElement('input');
  caption.type = 'text'; caption.className = 'f-caption'; caption.placeholder = 'Caption shown under the image';

  const row = document.createElement('div');
  row.className = 'row';

  const width = document.createElement('input');
  width.type = 'range'; width.min = 25; width.max = 100; width.value = 100; width.step = 5;
  width.className = 'f-width';
  const widthOut = document.createElement('span');
  widthOut.className = 'range-readout';
  widthOut.textContent = '100%';
  width.addEventListener('input', () => { widthOut.textContent = width.value + '%'; scheduleSave(); });
  const widthWrap = document.createElement('div');
  widthWrap.append(width, widthOut);

  const align = document.createElement('select');
  align.className = 'f-align';
  ['center','left','right'].forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; align.appendChild(o); });

  row.append(field('Display width', widthWrap), field('Alignment', align));

  [alt, caption].forEach(el => el.addEventListener('input', scheduleSave));
  align.addEventListener('change', scheduleSave);

  body.append(field('Image', dz), fileInput, field('Description / alt text', alt), field('Caption', caption), row);
  body.append(mkHint('Import per drag & drop. On export, the file is embedded directly into the HTML.'));
  blockList.appendChild(card);
  scheduleSave();
}

function mkHint(text){
  const p = document.createElement('div');
  p.className = 'hint';
  p.textContent = text;
  return p;
}

/* =========================================================
   Block: Code
   ========================================================= */

function addCodeBlock(){
  const { card, body } = cardShell('code', 'Code block');

  const row = document.createElement('div');
  row.className = 'row';

  const lang = document.createElement('input');
  lang.type = 'text'; lang.className = 'f-lang'; lang.placeholder = 'e.g. python';

  const height = document.createElement('input');
  height.type = 'range'; height.min = 100; height.max = 600; height.value = 220; height.step = 10;
  height.className = 'f-height';
  const heightOut = document.createElement('span');
  heightOut.className = 'range-readout';
  heightOut.textContent = '220px';

  const code = document.createElement('textarea');
  code.className = 'f-code';
  code.rows = 8;
  code.spellcheck = false;
  code.placeholder = 'Paste code here';
  code.style.cssText = 'font-family:\'IBM Plex Mono\',monospace;font-size:13px;background:var(--ink);color:#E8EAE3;border-radius:8px;padding:16px;height:220px;';

  height.addEventListener('input', () => {
    heightOut.textContent = height.value + 'px';
    code.style.height = height.value + 'px';
    scheduleSave();
  });

  const heightWrap = document.createElement('div');
  heightWrap.append(height, heightOut);

  row.append(field('Language label', lang), field('Field size (adjustable)', heightWrap));

  const desc = document.createElement('textarea');
  desc.className = 'f-desc';
  desc.rows = 2;
  desc.placeholder = 'Describe what this code does';

  [lang, code, desc].forEach(el => el.addEventListener('input', scheduleSave));

  body.append(row, field('Code (scrolls, rounded corners)', code), field('Code description', desc));
  blockList.appendChild(card);
  scheduleSave();
}

/* =========================================================
   Block: 3D model
   ========================================================= */

function addModelBlock(){
  const { card, body } = cardShell('model', '3D model');

  const dz = document.createElement('div');
  dz.className = 'dropzone';
  dz.tabIndex = 0;
  dz.textContent = 'Drag & drop model files: a .obj or .fbx, plus optional .mtl and texture images';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.hidden = true; fileInput.multiple = true;
  fileInput.accept = '.obj,.fbx,.mtl,.png,.jpg,.jpeg';

  const canvas = document.createElement('canvas');
  canvas.className = 'model-canvas';
  canvas.height = 320;
  canvas.hidden = true;

  const wireframeRow = document.createElement('div');
  wireframeRow.className = 'check-row';
  const wireframe = document.createElement('input');
  wireframe.type = 'checkbox'; wireframe.className = 'f-wireframe';
  const wfLabel = document.createElement('label');
  wfLabel.textContent = 'Wireframe view';
  wireframeRow.append(wireframe, wfLabel);
  wireframeRow.hidden = true;

  const fileList = document.createElement('div');
  fileList.className = 'hint';

  let viewerHandle = null;

  async function handleFiles(files){
    const arr = [...files];
    const store = fileStore.get(card.id) || {};
    store.models = arr;
    fileStore.set(card.id, store);
    fileList.textContent = 'Loaded: ' + arr.map(f => f.name).join(', ');

    canvas.hidden = false;
    wireframeRow.hidden = false;
    dz.hidden = true;

    if(viewerHandle) viewerHandle.dispose();
    viewerHandle = await initModelViewer(canvas, arr);
    wireframe.checked = false;
    wireframe.onchange = () => viewerHandle.setWireframe(wireframe.checked);
    scheduleSave();
  }

  setupDropzone(dz, fileInput, () => {}); // click-to-choose still opens the picker
  dz.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if(fileInput.files.length) handleFiles(fileInput.files); });
  ['dragenter','dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => { if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  const caption = document.createElement('input');
  caption.type = 'text'; caption.className = 'f-caption'; caption.placeholder = 'Caption shown under the model';
  caption.addEventListener('input', scheduleSave);

  body.append(
    field('Model files', dz), fileInput, fileList, canvas, wireframeRow,
    mkHint('Drag to orbit, scroll to zoom. On export, upload these same files to a models/ folder next to your post — the exported page loads them from there.'),
    field('Caption', caption)
  );
  blockList.appendChild(card);
  scheduleSave();
}

/* =========================================================
   Export — assembles a standalone post HTML matching
   post-template.html's design, with images embedded and
   3D models referenced from a models/ folder.
   ========================================================= */

async function buildExportHTML(){
  const meta = {
    category: val('metaCategory') || 'Category',
    date: val('metaDate') || new Date().toISOString().slice(0,10),
    title: val('metaTitle') || 'Untitled post',
    dek: val('metaDek') || '',
    tags: val('metaTags').split(',').map(s => s.trim()).filter(Boolean),
    readTime: val('metaReadTime') || ''
  };

  const heroFile = fileStore.get('__hero__');
  const heroAlt = escapeHtml(val('heroAlt'));
  let heroHtml = '';
  if(heroFile){
    const dataUrl = await fileToDataURL(heroFile);
    heroHtml = `
  <figure class="hero-figure">
    <div class="hero"><img src="${dataUrl}" alt="${heroAlt}"></div>
  </figure>`;
  }

  const blockCards = [...blockList.children];
  const blockHtmlParts = [];
  let modelCounter = 0;

  for(const card of blockCards){
    const type = card.dataset.type;

    if(type === 'heading'){
      const level = card.querySelector('.f-level').value;
      const align = card.querySelector('.f-align').value;
      const text = card.querySelector('.f-text').innerHTML;
      blockHtmlParts.push(`<${level} style="text-align:${align}">${text}</${level}>`);

    } else if(type === 'text'){
      const font = card.querySelector('.f-font').value;
      const size = card.querySelector('.f-size').value;
      const align = card.querySelector('.f-align').value;
      const fam = { sans:"'IBM Plex Sans',sans-serif", serif:"'Source Serif 4',serif", mono:"'IBM Plex Mono',monospace", display:"'Oswald',sans-serif" }[font];
      const html = card.querySelector('.f-html').innerHTML;
      blockHtmlParts.push(`<div style="font-family:${fam};font-size:${size}px;text-align:${align};line-height:1.7;margin:0 0 20px;">${html}</div>`);

    } else if(type === 'image'){
      const store = fileStore.get(card.id);
      if(store && store.image){
        const dataUrl = await fileToDataURL(store.image);
        const alt = escapeHtml(card.querySelector('.f-alt').value);
        const caption = escapeHtml(card.querySelector('.f-caption').value);
        const width = card.querySelector('.f-width').value;
        const align = card.querySelector('.f-align').value;
        const marginRule = align === 'center' ? 'margin-left:auto;margin-right:auto;' : (align === 'right' ? 'margin-left:auto;' : '');
        blockHtmlParts.push(`
<figure class="inline-figure" style="width:${width}%;${marginRule}">
  <img src="${dataUrl}" alt="${alt}">
  ${caption ? `<figcaption>${caption}</figcaption>` : ''}
</figure>`);
      }

    } else if(type === 'code'){
      const lang = escapeHtml(card.querySelector('.f-lang').value);
      const height = card.querySelector('.f-height').value;
      const code = escapeHtml(card.querySelector('.f-code').value);
      const desc = escapeHtml(card.querySelector('.f-desc').value);
      blockHtmlParts.push(`
${lang ? `<p class="code-lang">${lang}</p>` : ''}
<pre style="height:${height}px;"><code>${code}</code></pre>
${desc ? `<p class="code-desc">${desc}</p>` : ''}`);

    } else if(type === 'model'){
      const store = fileStore.get(card.id);
      if(store && store.models && store.models.length){
        modelCounter++;
        const id = 'model-' + modelCounter;
        const wireframe = card.querySelector('.f-wireframe').checked;
        const caption = escapeHtml(card.querySelector('.f-caption').value);
        const filenames = store.models.map(f => f.name);
        blockHtmlParts.push(buildViewerScriptTag(id, filenames, wireframe));
        if(caption) blockHtmlParts.push(`<figcaption>${caption}</figcaption>`);
      }
    }
  }

  const tagsHtml = meta.tags.length
    ? `<div class="tags">${meta.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
    : '';

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(meta.title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
<\/script>
<style>
  :root{ --paper:#EEF0EA; --paper-line:#C9CEC2; --ink:#1E2A38; --graphite:#5B6259; --stamp:#B03A2E; --brass:#8A6A3B; --card:#F6F7F2; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 40px, var(--paper); background-attachment:fixed; color:var(--ink); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:var(--ink); }
  a:focus-visible{ outline:2px solid var(--stamp); outline-offset:3px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:32px 32px 96px; }
  .runner{ display:flex; align-items:center; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--graphite); border-bottom:1px solid var(--paper-line); padding-bottom:14px; margin-bottom:40px; }
  .runner a{ text-decoration:none; color:var(--ink); }
  .runner a:hover{ color:var(--stamp); }
  .coversheet{ border:1.5px solid var(--ink); background:var(--card); padding:32px 32px 20px; margin-bottom:40px; }
  .coversheet .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; color:var(--stamp); text-transform:uppercase; margin:0 0 10px; }
  .coversheet h1{ font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; font-size:clamp(28px,4.6vw,44px); margin:0 0 10px; line-height:1.08; }
  .coversheet .dek{ font-size:16px; color:var(--graphite); max-width:46em; margin:0 0 24px; line-height:1.55; }
  .titleblock{ display:flex; flex-wrap:wrap; border-top:1px solid var(--ink); font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--graphite); }
  .titleblock div{ padding:10px 20px 0 0; margin-right:20px; }
  .titleblock span{ display:block; color:var(--ink); font-size:13px; margin-top:2px; }
  .hero{ border:1.5px solid var(--ink); background:var(--card); margin-bottom:8px; overflow:hidden; }
  .hero img{ display:block; width:100%; max-height:520px; object-fit:cover; }
  figure.hero-figure{ margin:0 0 48px; }
  article{ max-width:68ch; margin:0 auto; }
  article h2{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.01em; font-size:24px; margin:48px 0 16px; padding-bottom:8px; border-bottom:1px solid var(--paper-line); }
  article h3, article h4{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.01em; font-size:18px; text-transform:uppercase; margin:32px 0 12px; color:var(--ink); }
  article p{ font-size:16px; line-height:1.7; color:#2B3644; margin:0 0 20px; }
  article a{ color:var(--stamp); }
  figure.inline-figure{ margin:32px auto; }
  figure.inline-figure img{ display:block; width:100%; border:1.5px solid var(--ink); }
  figure.inline-figure figcaption{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--graphite); padding:8px 2px 0; }
  .code-lang{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--stamp); margin:28px 0 6px; }
  pre{ background:var(--ink); color:#E8EAE3; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.6; padding:18px 20px; overflow:auto; margin:0 0 8px; border-radius:8px; }
  .code-desc{ font-size:14px; color:var(--graphite); margin:0 0 28px; }
  .model-figure{ margin:32px 0 8px; }
  canvas.model-canvas{ width:100%; display:block; background:var(--paper); border:1.5px solid var(--ink); touch-action:none; }
  .model-controls{ display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--graphite); padding:8px 2px 0; text-transform:uppercase; letter-spacing:0.04em; }
  .tags{ display:flex; gap:8px; flex-wrap:wrap; margin:40px 0 0; }
  .tags .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; border:1px solid var(--brass); color:var(--brass); padding:3px 8px; }
  footer.colophon{ max-width:68ch; margin:64px auto 0; padding-top:20px; border-top:1px solid var(--paper-line); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--graphite); text-transform:uppercase; letter-spacing:0.05em; }
  footer.colophon a{ color:var(--ink); text-decoration:none; }
  footer.colophon a:hover{ color:var(--stamp); }
  @media (max-width:640px){ article{ max-width:100%; } }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="runner">
    <a href="../index.html" id="back-link-top">← Back</a>
    <span>${escapeHtml(meta.date)}</span>
  </div>
  <header class="coversheet">
    <p class="eyebrow">${escapeHtml(meta.category)}</p>
    <h1>${escapeHtml(meta.title)}</h1>
    ${meta.dek ? `<p class="dek">${escapeHtml(meta.dek)}</p>` : ''}
    <div class="titleblock">
      <div>Category<span>${escapeHtml(meta.category)}</span></div>
      <div>Date<span>${escapeHtml(meta.date)}</span></div>
      ${meta.readTime ? `<div>Read time<span>${escapeHtml(meta.readTime)}</span></div>` : ''}
    </div>
  </header>
  ${heroHtml}
  <article>
    ${blockHtmlParts.join('\n')}
    ${tagsHtml}
  </article>
  <footer class="colophon">
    <a href="../index.html" id="back-link-bottom">← Back to project index</a>
  </footer>
</div>
<script>
  function enableBack(id){
    const link = document.getElementById(id);
    if(!link) return;
    if(window.history.length > 1 && document.referrer){
      link.addEventListener('click', (e) => { e.preventDefault(); window.history.back(); });
    }
  }
  enableBack('back-link-top');
  enableBack('back-link-bottom');
<\/script>
</body>
</html>`;
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btnEl = document.getElementById('exportBtn');
  const original = btnEl.textContent;
  btnEl.textContent = 'Building…';
  try{
    const html = await buildExportHTML();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const slug = (val('metaTitle') || 'post').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'post';
    a.href = url;
    a.download = slug + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(err){
    alert('Export failed: ' + err.message);
  } finally {
    btnEl.textContent = original;
  }
});

function setupDropzone(zoneEl, inputEl, onFile){
  zoneEl.addEventListener('click', () => inputEl.click());
  zoneEl.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') inputEl.click(); });
  inputEl.addEventListener('change', () => { if(inputEl.files[0]) onFile(inputEl.files[0]); });
  ['dragenter','dragover'].forEach(evt => zoneEl.addEventListener(evt, e => {
    e.preventDefault(); zoneEl.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(evt => zoneEl.addEventListener(evt, e => {
    e.preventDefault(); zoneEl.classList.remove('drag');
  }));
  zoneEl.addEventListener('drop', e => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) onFile(file);
  });
}
</script>
